<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your profile · ApplyMate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="../">ApplyMate</a>
    <div><a href="colleges.html" style="color:var(--text);margin-right:16px">Colleges</a><button class="ghost" id="logout" type="button">Log out</button></div>
  </header>
  <main>
    <h1>Your profile</h1>
    <p class="lead">We use this to suggest colleges and deadlines that fit you.</p>
    <div class="card">
      <form id="form" novalidate>
        <label for="full_name">Full name</label>
        <input id="full_name" type="text" autocomplete="name" required>

        <label for="class_year">Class or year</label>
        <select id="class_year">
          <option value="">Select one</option>
          <option>Class 11</option><option>Class 12</option><option>Gap year</option>
          <option>College, 1st year</option><option>College, 2nd year or later</option>
        </select>

        <fieldset class="checks">
          <legend>Where do you want to apply?</legend>
          <label><input type="checkbox" name="country" value="India"> India</label>
          <label><input type="checkbox" name="country" value="US"> US</label>
          <label><input type="checkbox" name="country" value="UK"> UK</label>
        </fieldset>

        <label for="intended_course">Intended course</label>
        <input id="intended_course" type="text" placeholder="e.g. Computer Science, Economics">

        <label for="exam_scores">Exam scores <small>(optional)</small></label>
        <textarea id="exam_scores" rows="3" placeholder="e.g. Class 12 predicted 92%, JEE Main 96 percentile, SAT 1400"></textarea>

        <button class="primary" id="save" type="submit">Save profile</button>
        <div id="msg" role="status" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (text, type) => { $("msg").textContent = text; $("msg").className = type || ""; };
    const boxes = () => [...document.querySelectorAll('input[name="country"]')];
    let userId = null;

    async function init() {
      const { data } = await db.auth.getSession();
      if (!data.session) return (location.href = "login.html");   // not logged in
      userId = data.session.user.id;

      const { data: p, error } = await db.from("profiles").select("*").eq("id", userId).maybeSingle();
      if (error) return msg("Could not load your profile: " + error.message, "error");
      if (p) {
        $("full_name").value = p.full_name || "";
        $("class_year").value = p.class_year || "";
        $("intended_course").value = p.intended_course || "";
        $("exam_scores").value = p.exam_scores || "";
        boxes().forEach((b) => (b.checked = (p.target_countries || []).includes(b.value)));
      }
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!$("full_name").value.trim()) return msg("Enter your name.", "error");
      $("save").disabled = true; msg("");
      const { error } = await db.from("profiles").upsert({
        id: userId,
        full_name: $("full_name").value.trim(),
        class_year: $("class_year").value,
        target_countries: boxes().filter((b) => b.checked).map((b) => b.value),
        intended_course: $("intended_course").value.trim(),
        exam_scores: $("exam_scores").value.trim(),
        updated_at: new Date().toISOString(),
      });
      $("save").disabled = false;
      error ? msg("Could not save: " + error.message, "error") : msg("Profile saved.", "ok");
    });

    $("logout").addEventListener("click", async () => {
      await db.auth.signOut();
      location.href = "login.html";
    });

    init();
  </script>
</body>
</html>
